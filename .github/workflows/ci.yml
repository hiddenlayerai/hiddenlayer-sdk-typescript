# .github/workflows/ci.yml
#
# Builds the package and runs its tests on every PR and every push to main:
# the generated client with Fern's unit and wire tests, and the wrapper with
# its own (PLT-1429). Fern PRs merge on green, so this is the gate between a
# generation and main.
#
# Invariants:
#   - Installs are immutable: a PR whose yarn.lock doesn't match package.json
#     fails here rather than relocking in CI.
#   - No secret and no write permission: this runs on PRs from anyone.
#
# From hl-sdk-gen's template/; edit it there and copy it into the repo.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    # hiddenlayerai has no scale-set runners
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: |
          # The package manager comes from package.json's packageManager pin, which Corepack enforces.
          corepack enable
          case "$(node -p "(require('./package.json').packageManager ?? '').split('@')[0]")" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable ;;
            *) echo "::error::package.json pins no packageManager; Fern writes one."; exit 1 ;;
          esac

      - name: Build
        run: npm run build

      - name: Check the package's exports
        run: node scripts/verify-package.mjs

  test:
    # hiddenlayerai has no scale-set runners
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: |
          # The package manager comes from package.json's packageManager pin, which Corepack enforces.
          corepack enable
          case "$(node -p "(require('./package.json').packageManager ?? '').split('@')[0]")" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable ;;
            *) echo "::error::package.json pins no packageManager; Fern writes one."; exit 1 ;;
          esac

      - name: Test
        run: npm exec --no -- vitest run
